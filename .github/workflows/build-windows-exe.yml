name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-pyinstaller

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          echo "Validating GTK/PyGObject runtime availability..."
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk"
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name Quickr \
            --paths src \
            --collect-all gi \
            --hidden-import=gi.repository.Gtk \
            --hidden-import=gi.repository.Gdk \
            --hidden-import=gi.repository.Gio \
            --hidden-import=gi.repository.GdkPixbuf \
            --hidden-import=gi.repository.GLib \
            quickr.py

          if [ ! -f VERSION ]; then
            echo "VERSION file not found at repository root (expected: ./VERSION)." >&2
            exit 1
          fi

          IFS= read -r version < VERSION
          version="${version//$'\r'/}"
          if [ -z "$version" ]; then
            echo "VERSION file is empty; set a version string in ./VERSION before building." >&2
            exit 1
          fi

          artifact_name="Quickr-${version}-windows-x86_64.zip"
          (cd dist && zip -r "../$artifact_name" Quickr)
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Upload Windows package as release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}

      - name: Upload Windows package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 30
